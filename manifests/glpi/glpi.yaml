apiVersion: v1
kind: Service
metadata:
  name: glpi
  namespace: glpi
spec:
  selector:
    app: glpi
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glpi-data
  namespace: glpi
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glpi
  namespace: glpi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glpi
  template:
    metadata:
      labels:
        app: glpi
    spec:
      containers:
        - name: glpi
          image: ghcr.io/glpi-project/glpi:11.0.8
          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

          env:
            - name: GLPI_DB_HOST
              value: mariadb
            - name: GLPI_DB_PORT
              value: "3306"
            - name: GLPI_DB_NAME
              value: glpi
            - name: GLPI_DB_USER
              value: glpi
            - name: GLPI_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: glpi-db-secret
                  key: MARIADB_PASSWORD

          volumeMounts:
            - name: data
              mountPath: /var/glpi

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: glpi-data
