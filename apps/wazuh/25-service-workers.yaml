apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-internal: 0.0.0.0/0
  labels:
    app: wazuh-manager
  name: wazuh-workers
  namespace: wazuh
spec:
  externalTrafficPolicy: Cluster
  ports:
  - name: agents-events
    nodePort: 32040
    port: 1514
    protocol: TCP
    targetPort: 1514
  selector:
    app: wazuh-manager
    node-type: worker
  type: NodePort
