apiVersion: v1
kind: Service
metadata:
  annotations:
    metallb.universe.tf/ip-allocated-from-pool: first-pool
  labels:
    app: wazuh-indexer
  name: indexer
  namespace: wazuh
spec:
  allocateLoadBalancerNodePorts: true
  externalTrafficPolicy: Cluster
  ports:
  - name: indexer-rest
    nodePort: 30670
    port: 9200
    protocol: TCP
    targetPort: 9200
  selector:
    app: wazuh-indexer
  type: LoadBalancer
