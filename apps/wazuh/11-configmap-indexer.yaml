apiVersion: v1
data:
  internal_users.yml: "---\n# This is the internal user database\n# The hash value\
    \ is a bcrypt hash and can be generated with plugin/tools/hash.sh\n\n_meta:\n\
    \  type: \"internalusers\"\n  config_version: 2\n\n# Define your internal users\
    \ here\n\n## Demo users\n\nadmin:\n  hash: \"$2y$12$K/SpwjtB.wOHJ/Nc6GVRDuc1h0rM1DfvziFRNPtk27P.c4yDr9njO\"\
    \n  reserved: true\n  backend_roles:\n  - \"admin\"\n  description: \"Demo admin\
    \ user\"\n\nkibanaserver:\n  hash: \"$2a$12$4AcgAt3xwOWadA5s5blL6ev39OXDNhmOesEoo33eZtrq2N0YrU3H.\"\
    \n  reserved: true\n  description: \"Demo kibanaserver user\"\n\nkibanaro:\n \
    \ hash: \"$2a$12$JJSXNfTowz7Uu5ttXfeYpeYE0arACvcwlPBStB1F.MI7f0U9Z4DGC\"\n  reserved:\
    \ false\n  backend_roles:\n  - \"kibanauser\"\n  - \"readall\"\n  attributes:\n\
    \    attribute1: \"value1\"\n    attribute2: \"value2\"\n    attribute3: \"value3\"\
    \n  description: \"Demo kibanaro user\"\n\nlogstash:\n  hash: \"$2a$12$u1ShR4l4uBS3Uv59Pa2y5.1uQuZBrZtmNfqB3iM/.jL0XoV9sghS2\"\
    \n  reserved: false\n  backend_roles:\n  - \"logstash\"\n  description: \"Demo\
    \ logstash user\"\n\nreadall:\n  hash: \"$2a$12$ae4ycwzwvLtZxwZ82RmiEunBbIPiAmGZduBAjKN0TXdwQFtCwARz2\"\
    \n  reserved: false\n  backend_roles:\n  - \"readall\"\n  description: \"Demo\
    \ readall user\"\n\nsnapshotrestore:\n  hash: \"$2y$12$DpwmetHKwgYnorbgdvORCenv4NAK8cPUg8AI6pxLCuWf/ALc0.v7W\"\
    \n  reserved: false\n  backend_roles:\n  - \"snapshotrestore\"\n  description:\
    \ \"Demo snapshotrestore user\"\n"
  opensearch.yml: "cluster.name: ${CLUSTER_NAME}\nnode.name: ${NODE_NAME}\nnetwork.host:\
    \ ${NETWORK_HOST}\ndiscovery.seed_hosts: wazuh-indexer-0.wazuh-indexer\ncluster.initial_master_nodes:\n\
    \  - wazuh-indexer-0\n\nnode.max_local_storage_nodes: \"3\"\npath.data: /var/lib/wazuh-indexer\n\
    path.logs: /var/log/wazuh-indexer\nplugins.security.ssl.http.pemcert_filepath:\
    \ /usr/share/wazuh-indexer/config/certs/node.pem\nplugins.security.ssl.http.pemkey_filepath:\
    \ /usr/share/wazuh-indexer/config/certs/node-key.pem\nplugins.security.ssl.http.pemtrustedcas_filepath:\
    \ /usr/share/wazuh-indexer/config/certs/root-ca.pem\nplugins.security.ssl.transport.pemcert_filepath:\
    \ /usr/share/wazuh-indexer/config/certs/node.pem\nplugins.security.ssl.transport.pemkey_filepath:\
    \ /usr/share/wazuh-indexer/config/certs/node-key.pem\nplugins.security.ssl.transport.pemtrustedcas_filepath:\
    \ /usr/share/wazuh-indexer/config/certs/root-ca.pem\nplugins.security.ssl.http.enabled:\
    \ true\nplugins.security.ssl.transport.enforce_hostname_verification: false\n\
    plugins.security.ssl.transport.resolve_hostname: false\nplugins.security.authcz.admin_dn:\n\
    \  - CN=admin,O=Company,L=California,C=US\nplugins.security.check_snapshot_restore_write_privileges:\
    \ true\nplugins.security.enable_snapshot_restore_privilege: true\nplugins.security.nodes_dn:\n\
    \  - CN=indexer,O=Company,L=California,C=US\nplugins.security.restapi.roles_enabled:\n\
    - \"all_access\"\n- \"security_rest_api_access\"\nplugins.security.allow_default_init_securityindex:\
    \ true\ncluster.routing.allocation.disk.threshold_enabled: false\ncompatibility.override_main_response_version:\
    \ true"
kind: ConfigMap
metadata:
  name: indexer-conf-45bbc2fk49
  namespace: wazuh
