apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: librechat
  namespace: argocd
spec:
  project: default

  source:
    repoURL: ghcr.io/danny-avila/librechat-chart
    chart: librechat
    targetRevision: 2.0.8

    helm:
      values: |
        replicaCount: 1

        image:
          repository: registry.librechat.ai/danny-avila/librechat
          tag: v0.8.8-rc2

        librechat:
          existingSecretName: librechat-credentials-env

          configEnv:
            HOST: "0.0.0.0"
            PORT: "3080"

          imageVolume:
            enabled: false

          livenessProbe:
            httpGet:
              path: /health
              port: 3080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          readinessProbe:
            httpGet:
              path: /health
              port: 3080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          configYamlContent: |-
            version: 1.3.13
            cache: true

        mongodb:
          enabled: true
          persistence:
            enabled: true
            storageClass: local-path
            accessModes:
              - ReadWriteOnce
            size: 8Gi

        meilisearch:
          enabled: true
          persistence:
            enabled: true
            storageClass: local-path

        redis:
          enabled: false

        librechat-rag-api:
          enabled: false

        nodeSelector:
          kubernetes.io/hostname: k8s-02

        ingress:
          enabled: true
          className: nginx
          hosts:
            - host: librechat.local
              paths:
                - path: /
                  pathType: Prefix

  destination:
    server: https://kubernetes.default.svc
    namespace: librechat

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
