apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: glpi
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/yorixt1x/k8s-lab-gitops.git
    targetRevision: HEAD
    path: manifests/glpi

  destination:
    server: https://kubernetes.default.svc
    namespace: glpi

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
